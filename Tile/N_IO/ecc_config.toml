# This tile's frozen die. The height is its fabric row's, which every type in
# that row is built to. The width is not stated here: this tile shares columns
# 1, 2, 4, 5, 7 and 8 with LUT4x8_ha, whose own [die] claims them, and
# `flow.plan.build_plan` sizes every type from the column and row claims rather
# than from its own table. Stating it again would only give `_claim` a second
# number to refuse whenever the LUT column moves.
# Bound by N_IO: at 82.6 x 22.4 um it fills 0.7144 of its core and
# 0.8594 of the area DreamPlace places into, and routes 0
# with 0 DRC. Round r2, 2026-09-21.
[die]
height_micron = 22.4

[synthesis]
# ABC sizes against abc_load alone and leaves X0P5 drivers on nets that route
# to 0.03 to 0.1 pF; the weak drives it may not use cost no area to ban.
avoid_weak_drives = true
