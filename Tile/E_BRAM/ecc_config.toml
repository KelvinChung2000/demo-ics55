# What this tile type takes instead of the shared defaults in
# Tile/include/ecc_config.toml. Every key has to be one `ecc param list` prints;
# flow.config refuses anything else before a run starts.
#
# No `[synthesis].strategy`. The other two BEL-carrying types were swept because
# cell area decided their column width; here the column is set by a hard macro
# 164.430 um wide and the standard cells have room to spare, so the default
# DELAY 4 stands until a route fails on it.

# The macro occupies the east 164.430 um of the core over its lower 90.535 um,
# so the placer works in an L, and the 758 standard cells it has to spread there
# come to 2838 um^2 against 16,200 um^2 of free core. DreamPlace fills the gap
# between this number and the 0.239 the cells actually occupy with filler nodes,
# and at 0.6 it made 139,000 units of them and never cleared its density
# constraint: 1000 iterations at 0.237 overflow against a 0.1 stop, then
# `placement failed`. It is set just above the measured utilisation instead.
[params.place]
target_density = 0.3

# Off, and this is what makes the tile place at all. DreamPlace's routability
# pass inflates every movable cell by the congestion it predicts, 32% of the
# movable area on the first round here, and then cannot meet its own density
# constraint in a core the macro takes half of: 1000 iterations ending at 0.237
# overflow against a 0.1 stop, or 0.389 with a lower target. With the pass off
# the tile places at 0.239 and every one of its 369 pins holds. There is no
# congestion for the pass to relieve, since 758 cells have 16,200 um^2.
routability_opt = 0

# The width of the east fabric column, which NE_term and SE_term repeat.
# 164.430 um of macro, 4 um of core margin and 25.8 um of west channel.
#
# The channel is not slack and the column does not go narrower. Swept
# 2026-09-22 at the macro's own y, with every other column unchanged, and the
# signoff DRC count is the channel's:
#
#     194.4   channel 25.8      45
#     182.4   channel 13.8    5524
#     176.4   channel  7.8   10118
#     170.4   channel  1.8    8238
#
# What fills it is not the 758 cells, which are 2838 um^2 against 12,000 in the
# band above the macro alone. It is the escape routing for the 141 of this
# tile's 256 east-west pins that sit beside the macro and have to reach north or
# south past it on MET2 and MET4. Rotating the macro does not help: at R90 it is
# 90.535 x 164.430 and would leave 480 um^2 of a 90.6 um column, far under what
# the switch matrices need. One lever is untried, centring the macro vertically
# so the escape is shorter in both directions rather than 19.6 um one way and
# 53.7 the other.
[die]
width_micron = 194.4

# No height. This type spans two grid rows and `flow.plan._override_die` refuses
# a single height for a multi-row type. Its 168.0 um is LUT4x8_ha's 84.0 twice.

# The memory this tile is built around. `flow.cli.harden` breaks the run after
# synthesis to append these two views to the workspace database, then fixes the
# instance here rather than letting DreamPlace place it: an abutted tile has
# nowhere to move a macro to, and `flow.plan` drew the pin plan around where it
# sits. The instance name is read from the netlist, since Yosys flattens the
# BEL into the tile and names it itself.
#
# 27.8 puts the macro's east face 0.17 um inside the core, against the fabric's
# own east edge, and 21.6 is the fifteenth standard-cell row. The three numbers
# that matter are the channels this leaves: 25.8 um west, where all 256 east-west
# pins land, 19.6 um south and 53.7 um north, where the 24 shared pins of each
# terminator row come in. The east channel is 0.17 um and is not one, so
# `flow.plan.macro_shadow` keeps the 65 boundary pins of that edge out of the
# macro's span instead; placed into it, they cost 4768 DRC violations the router
# never cleared.
[macro]
cell = "ics55_ecos_sram_512x32_m4"
lef = "../../primitives/ICS55_SRAM_512x32_1RW/ics55/ics55_ecos_sram_512x32_m4.lef"
lib = "../../primitives/ICS55_SRAM_512x32_1RW/ics55/ics55_ecos_sram_512x32_m4_ss1p08v125ccmax.lib"
x_micron = 27.8
y_micron = 21.6
orientation = "R0"
