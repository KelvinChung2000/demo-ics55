# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
#
# Harden this FABulous fabric on ICS55 with ECC, abut it and prove every seam.
# Override any variable via CLI: task harden JOBS=6 TILE=LUT4x8_ha
version: "3"

vars:
  # The LUT4x8_ha width every other tile is scaled against, from
  # eFPGA_geometry.csv's proportions. 110 and the 90 that fails to route were
  # both measured on the old LUT4AB, so neither bound is established for the
  # tile library's LUT; see FINDINGS.md.
  ANCHOR: '{{.ANCHOR | default "110"}}'
  JOBS: '{{.JOBS | default "3"}}'
  TILE: '{{.TILE | default "LUT4x8_ha"}}'
  STEP: '{{.STEP | default "filler_ecc"}}'
  # Which tool assembles the hardened tiles: klayout abuts them and proves every
  # seam, ecc runs the macro-placed parent through its own flow, both does each.
  STITCHER: '{{.STITCHER | default "klayout"}}'
  BUILD: '{{.BUILD | default "build"}}'
  ECC: '{{.ECC | default "/home/kelvin/side-project/ecc-spike/eccw-main"}}'
  VIEWER: '{{.VIEWER | default "/home/kelvin/side-project/ecos-studio/ecos/chip-viewer/target/release/chip-viewer-native"}}'
  FLOW: python3 -m flow.cli

tasks:
  efpga:
    aliases: [default, build]
    desc: >-
      Compile the whole fabric on the ECC side, from the committed RTL to one
      assembled layout. About forty minutes. STITCHER=klayout (default), ecc or
      both picks which tool assembles the tiles.
    cmds:
      - task: plan
      - task: check
      - task: harden
      - task: assemble

  assemble:
    desc: >-
      Assemble the hardened tiles into one layout. STITCHER=klayout paints them,
      abuts them and proves every seam, ecc hardens the macro-placed parent to
      filler, both runs each.
    cmds:
      - "{{.FLOW}} assemble --stitcher {{.STITCHER}}"

  sync-tiles:
    desc: Re-vendor Tile/ and primitives/ from the pinned FABulous tile library
    cmds:
      - "{{.FLOW}} sync-tiles"

  gen-io-order:
    desc: Regenerate each tile's io_pin_order.yaml with FABulous's own generator
    cmds:
      - "{{.FLOW}} gen-io-order"

  plan:
    desc: Size every tile and place every pin, writing build/fabric_plan.json
    cmds:
      - "{{.FLOW}} plan --anchor-micron {{.ANCHOR}}"

  check:
    desc: Test the plan's wiring properties without running any EDA tool
    cmds:
      - "{{.FLOW}} check"

  harden:
    desc: >-
      Run every tile type from synthesis to macro. Takes about forty minutes.
      Pass ECC parameter overrides after --, as `-- --set place.target_density=0.55`
    cmds:
      - "{{.FLOW}} harden --jobs {{.JOBS}} {{.CLI_ARGS}}"

  harden-one:
    desc: >-
      Harden one tile type, discarding any existing run. Set TILE. Pass ECC
      parameter overrides after --, as `-- --set place.target_density=0.55`;
      an overridden run builds into build/tiles/<TILE>@<overrides> of its own.
    cmds:
      - "{{.FLOW}} harden --force --jobs 1 --tile {{.TILE}} {{.CLI_ARGS}}"

  stitch:
    desc: >-
      Paint every hardened tile, abut the fabric and prove every seam conducts and
      pairs correctly. Refuses a tile whose die is not the one the plan says.
    cmds:
      - "{{.FLOW}} stitch"

  top:
    desc: Write the fabric-level ECC project and floorplan it with the tiles as macros
    cmds:
      - "{{.FLOW}} top"

  synth:
    desc: >-
      Synthesise every tile type into build/tiles/<TYPE>_nl and stop, which is all
      the flat control reads from them. Rerunning is cheap once the workspaces exist.
    cmds:
      - "{{.FLOW}} synth --jobs {{.JOBS}}"

  flat:
    desc: Harden the whole eFPGA as one design, composed from the tiles' gate netlists
    cmds:
      - task: synth
      - "{{.FLOW}} flat"

  find:
    desc: >-
      Find names in a chip-viewer snapshot by regex and copy one to the clipboard,
      for pasting into the viewer's search box. Pass arguments after --
    cmds:
      - "{{.FLOW}} find {{.CLI_ARGS}}"

  view-fabric:
    desc: Open the macro-placed fabric in the ECOS layout viewer
    cmds:
      - "{{.VIEWER}} --manifest {{.BUILD}}/fabric/default/postFloorplan_ecc/output/geometry/geometry.manifest"

  view-tile:
    desc: Open one tile in the ECOS layout viewer, with its DRC overlay. Set TILE and STEP.
    cmds:
      - >-
        {{.VIEWER}}
        --manifest {{.BUILD}}/tiles/{{.TILE}}/default/{{.STEP}}/output/geometry/geometry.manifest
        --drc-statis {{.BUILD}}/tiles/{{.TILE}}/default/drc_ecc/analysis/drc_statis.csv

  image:
    desc: Render the stitched fabric to a PNG
    cmds:
      - "{{.ECC}} layout-image --gds {{.BUILD}}/eFPGA.gds --image {{.BUILD}}/eFPGA.png --width 3000 --height 4800"

  drc:
    desc: Report the signoff DRC count of every tile build that has one
    cmds:
      - >-
        python3 -c 'import json, pathlib;
        [print(f"{d.name:16s}", next((m["value"] for m in json.loads(q.read_text())["metrics"] if m["id"] == "drc_count"), "-"))
        for d in sorted(pathlib.Path("{{.BUILD}}/tiles").iterdir())
        if (q := d / "default/drc_ecc/analysis/qor_metrics.json").exists()]'

  clean:
    desc: Delete every build artefact. Everything here is reproducible with `task build`.
    prompt: This removes {{.BUILD}}, which is several gigabytes of ECC workspaces. Continue?
    cmds:
      - rm -rf {{.BUILD}}
